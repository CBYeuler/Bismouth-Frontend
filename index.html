<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bismouth</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Syne:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <nav class="navbar">
        <div class="navbar-left">
            <span class="app-logo">
                <i data-lucide="hexagon" class="logo-icon"></i>
                <span class="app-name">Bismouth</span>
            </span>
            <div class="filepath-wrap">
                <i data-lucide="folder-open" class="filepath-icon"></i>
                <input type="text" id="filepath" placeholder="No workspace open" autocomplete="off" spellcheck="false">
            </div>
        </div>
        <div class="navbar-right">
            <a href="#">Just</a>
            <a href="#">Useful</a>
            <a href="#">Stuff</a>
            <div class="divider-v"></div>
            <button id="theme-toggle" aria-label="Toggle theme">
                <i data-lucide="sun"></i>
            </button>
        </div>
    </nav>

    <div id="sidebar">
        <div class="sidebar-section-label">Explorer</div>
        <ul>
            <li><a href="#"><i data-lucide="file-text"></i><span>Sidebar Item 1</span></a></li>
            <li><a href="#"><i data-lucide="file-text"></i><span>Sidebar Item 2</span></a></li>
            <li><a href="#"><i data-lucide="file-text"></i><span>Sidebar Item 3</span></a></li>
        </ul>
    </div>

    <button id="toggle-sidebar" aria-label="Toggle sidebar">
        <i data-lucide="chevron-left" id="toggle-icon"></i>
    </button>

    <div id="main-content">
        <div class="editor-header">
            <span class="editor-tab active">
                <i data-lucide="file-text"></i>
                <span>Untitled</span>
            </span>
        </div>
        <div class="editor-wrap">
            <div class="line-numbers" id="line-numbers">1</div>
            <div id="editor" contenteditable="true" spellcheck="true" placeholder="Start writing…"></div>
        </div>
        <div class="statusbar">
            <span id="word-count">0 words</span>
            <span id="char-count">0 chars</span>
            <span class="statusbar-right">Bismouth v0.1</span>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
